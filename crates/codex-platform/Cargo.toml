[package]
name = "codex-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform processes, Git, PTY, and Computer Use for codexRS"
publish = false

[dependencies]
base64.workspace = true
codex-protocol = { path = "../codex-protocol" }
crossbeam-channel.workspace = true
image.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
enigo = { version = "0.6.1", default-features = false }
win32job = "2.0.3"
xcap = "0.9.7"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6.1", default-features = false, features = ["wayland", "x11rb"] }
xcap = "0.9.7"

[lints]
workspace = true
