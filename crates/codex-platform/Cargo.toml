[package]
name = "codex-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform processes, Git, PTY, and Computer Use for codexRS"
publish = false

[dependencies]
base64.workspace = true
codex-core = { path = "../codex-core" }
codex-protocol = { path = "../codex-protocol" }
crossbeam-channel.workspace = true
image.workspace = true
interprocess.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tungstenite.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
enigo = { version = "0.6.1", default-features = false }
lnks = { version = "0.2.0", default-features = false }
roxmltree = "0.20.0"
sha2.workspace = true
uiautomation = { version = "0.25.0", default-features = false, features = ["input", "pattern"] }
win32job = "2.0.3"
winsafe = { version = "0.0.19", default-features = false, features = ["gui"] }
xcap = "0.9.7"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6.1", default-features = false, features = ["wayland", "x11rb"] }
xcap = "0.9.7"

[lints]
workspace = true
