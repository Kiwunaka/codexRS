name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v7

      - name: Restore Cargo build cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}

      - name: Add Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter fxc.exe -Recurse |
            Where-Object FullName -Match '\\x64\\fxc\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $fxc) {
            throw "Windows SDK fxc.exe was not found"
          }
          "GPUI_FXC_PATH=$($fxc.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libclang-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Toolchain
        run: rustup show active-toolchain

      - name: Dependency policy
        run: python scripts/check_dependency_policy.py

      - name: Format
        run: cargo fmt --all --check

      - name: Patched Markdown renderer
        run: |
          rustfmt --edition 2024 --check third_party/gpui-component/src/text/text_view.rs third_party/gpui-component/src/text/node.rs third_party/gpui-component/src/text/format/markdown.rs
          cargo clippy --locked --manifest-path third_party/gpui-component/Cargo.toml --target-dir target --lib -- -D warnings
          cargo test --locked --manifest-path third_party/gpui-component/Cargo.toml --target-dir target source_highlights_preserve_nested_markdown_marks

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Release build
        run: cargo build --locked --release -p codex-app

      - name: Save Cargo build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
