name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  licenses:
    name: Third-party licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          CARGO_PKG_VERSION="$(cargo metadata --locked --manifest-path crates/codex-app/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "codex-app") | .version')"
          test -n "${CARGO_PKG_VERSION}"
          test "${GITHUB_REF_NAME}" = "v${CARGO_PKG_VERSION}"

      - name: Install cargo-about
        run: cargo install --locked --features cli --version 0.9.1 cargo-about

      - name: Generate license inventory
        run: cargo about generate --locked about.hbs --output-file THIRD_PARTY_LICENSES.html

      - uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.html
          if-no-files-found: error
          retention-days: 7

  build:
    name: Package ${{ matrix.label }}
    needs: licenses
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
          - os: ubuntu-24.04
            label: linux-x86_64
    env:
      PACKAGE_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || format('snapshot-{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@v7

      - name: Add Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter fxc.exe -Recurse |
            Where-Object FullName -Match '\\x64\\fxc\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $fxc) {
            throw "Windows SDK fxc.exe was not found"
          }
          "GPUI_FXC_PATH=$($fxc.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libclang-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses

      - name: Dependency policy
        run: python scripts/check_dependency_policy.py

      - name: Format
        run: cargo fmt --all --check

      - name: Patched Markdown renderer
        run: |
          rustfmt --edition 2024 --check third_party/gpui-component/src/text/text_view.rs third_party/gpui-component/src/text/node.rs third_party/gpui-component/src/text/format/markdown.rs
          cargo clippy --locked --manifest-path third_party/gpui-component/Cargo.toml --target-dir target --lib -- -D warnings
          cargo test --locked --manifest-path third_party/gpui-component/Cargo.toml --target-dir target source_highlights_preserve_nested_markdown_marks

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Release build
        run: cargo build --locked --release -p codex-app

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "codexrs-$env:PACKAGE_LABEL-windows-x86_64"
          $root = Join-Path dist $name
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root "docs/assets") -Force | Out-Null
          Copy-Item target/release/codexrs.exe $root
          Copy-Item target/release/codex-computer-use-overlay.exe $root
          Copy-Item README.md,README.ru.md,README.zh-CN.md,LICENSE,CHANGELOG.md,THIRD_PARTY_LICENSES.html $root
          Copy-Item docs/architecture.md,docs/parity-matrix.md,docs/platform-support.md,docs/prior-art.md (Join-Path $root "docs")
          Copy-Item docs/assets/codexrs-hero.png (Join-Path $root "docs/assets")
          Compress-Archive -Path $root -DestinationPath "dist/$name.zip"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          name="codexrs-${PACKAGE_LABEL}-linux-x86_64"
          root="dist/${name}"
          mkdir -p "${root}/docs/assets"
          install -m 0755 target/release/codexrs "${root}/codexrs"
          cp README.md README.ru.md README.zh-CN.md LICENSE CHANGELOG.md THIRD_PARTY_LICENSES.html "${root}/"
          cp docs/architecture.md docs/parity-matrix.md docs/platform-support.md docs/prior-art.md "${root}/docs/"
          cp docs/assets/codexrs-hero.png "${root}/docs/assets/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: codexrs-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: codexrs-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.zip ./*.tar.gz > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(cat <<'EOF'
          ## Unsigned portable technical preview

          These Windows ZIP and Linux tar.gz assets are unsigned portable
          previews. Download only from this GitHub Release and verify the
          matching `SHA256SUMS.txt` entry before extraction. The checksum helps
          detect corruption after download; it is not an independent publisher
          signature.

          There is no installer, uninstaller, desktop integration, URI handler,
          or automatic updater. Extract into a directory you control. On
          Windows, keep `codexrs.exe` and `codex-computer-use-overlay.exe`
          together. Do not enable Computer Use from an archive whose source or
          checksum you do not trust.

          The Linux tar.gz is not a system package and does not install runtime
          dependencies. Ubuntu CI builds and tests the binary; the extracted
          archive has not yet received a desktop smoke test. Linux Computer Use
          is unavailable in RC4; X11/XWayland and pure-Wayland support remain
          future work.
          EOF
          )"
          options=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "codexRS ${GITHUB_REF_NAME}" \
            --notes "$notes" \
            --generate-notes \
            "${options[@]}"
