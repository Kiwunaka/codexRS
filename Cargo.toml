[workspace]
resolver = "3"
members = [
    "crates/codex-app",
    "crates/codex-core",
    "crates/codex-platform",
    "crates/codex-protocol",
    "crates/codex-storage",
]
default-members = ["crates/codex-app"]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/Kiwunaka/codexRS"
homepage = "https://github.com/Kiwunaka/codexRS"

[workspace.dependencies]
base64 = "0.23.0"
crossbeam-channel = "0.5.15"
gpui = "=0.2.2"
gpui-component = { version = "=0.5.1", default-features = false }
image = { version = "0.25.8", default-features = false, features = ["jpeg"] }
portable-pty = "0.9.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vt100 = "0.16.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
