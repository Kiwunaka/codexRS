[workspace]
resolver = "3"
members = [
    "crates/codex-app",
    "crates/codex-core",
    "crates/codex-platform",
    "crates/codex-protocol",
    "crates/codex-storage",
]
exclude = ["third_party/gpui-component"]
default-members = ["crates/codex-app"]

[workspace.package]
version = "0.1.0-rc.2"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/Kiwunaka/codexRS"
homepage = "https://github.com/Kiwunaka/codexRS"

[workspace.dependencies]
base64 = "0.23.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5.15"
futures = "0.3.31"
gpui = "=0.2.2"
gpui-component = { version = "=0.5.1", default-features = false }
gpui-component-assets = "=0.5.1"
image = { version = "0.25.8", default-features = false, features = ["jpeg"] }
interprocess = { version = "2.4.2", default-features = false }
markdown = "1.0.0"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sysinfo = "0.31.4"
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
url = "2.5.8"
vt100 = "0.16.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"

[patch.crates-io]
gpui-component = { path = "third_party/gpui-component" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
